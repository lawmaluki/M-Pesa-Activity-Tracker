name: mpesa_tracker
description: M-Pesa Activity Tracker — GitHub-style heatmap for your money movements.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File picking for statement imports
  file_picker: ^8.1.2

  # Permissions
  permission_handler: ^11.3.1

  # SMS reading (Android)
  flutter_sms_inbox: ^1.0.3

  # CSV parsing for statement imports
  csv: ^6.0.0

  # PDF statement import — password-protected opening + text extraction
  # (free/open-source, no license key, built on pdfium via FFI)
  pdfrx: ^1.3.5

  # Date formatting
  intl: ^0.19.0

  # Persisting the user's light/dark/system theme choice
  shared_preferences: ^2.3.2

  # Share card — capture the heatmap/stats card as an image, then save it
  # to the gallery or hand it off to the native share sheet.
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
